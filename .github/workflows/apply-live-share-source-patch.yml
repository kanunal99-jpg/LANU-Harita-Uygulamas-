name: Apply live-share source patch

on:
  push:
    branches: [main]
    paths:
      - tools/patch_live_share.py
      - .github/workflows/apply-live-share-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'kanunal99-jpg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python tools/patch_live_share.py
      - name: Commit consolidated source change
        run: |
          git config user.name 'kanunal99-jpg'
          git config user.email 'kanunal99@gmail.com'
          git rm tools/patch_live_share.py .github/workflows/apply-live-share-source-patch.yml tools/noop
          git add app/src/main/java/com/example/haritalar/ui/MainViewModel.kt
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate live sharing into navigation lifecycle'
          git push origin main
