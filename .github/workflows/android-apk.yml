name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Enforce LANU constitution
        run: bash .github/scripts/constitution-quality-gate.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.3.1'
      - name: Prepare Linux KVM permissions
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo 'ERROR: /dev/kvm is unavailable on the GitHub runner.'
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Warm Android emulator SDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager executable could not be located under ANDROID_HOME."
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          for attempt in 1 2 3; do
            echo "Android emulator SDK warm-up attempt ${attempt}/3"
            if "$SDKMANAGER" --install \
              emulator \
              'system-images;android-34;google_apis;x86_64' \
              --channel=0; then
              echo "Android emulator SDK packages are ready."
              exit 0
            fi

            echo "sdkmanager failed; clearing transient download caches before retry."
            rm -rf "$HOME/.android/cache"/* 2>/dev/null || true
            rm -rf "${ANDROID_HOME:-/usr/local/lib/android/sdk}/.temp"/* 2>/dev/null || true
            sleep $((attempt * 10))
          done

          echo "ERROR: Android emulator SDK packages could not be prepared after 3 attempts."
          exit 1
      - name: Prepare Android debug signing (stable secret or ephemeral fallback)
        env:
          LANU_DEBUG_KEYSTORE_BASE64: ${{ secrets.LANU_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${LANU_DEBUG_KEYSTORE_BASE64}" ]; then
            printf '%s' "${LANU_DEBUG_KEYSTORE_BASE64}" | base64 --decode > debug.keystore
            test -s debug.keystore
            keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "APK_SIGNING_SOURCE=github-actions-stable-secret" >> "$GITHUB_ENV"
            echo "Stable Android debug signing loaded from encrypted GitHub Actions secret."
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
            echo "APK_SIGNING_SOURCE=ephemeral-debug-unsafe-upgrade" >> "$GITHUB_ENV"
            echo "::warning::Signing secret not configured: generated debug key varies across runs; previous APK cannot safely be overwritten as an upgrade."
          fi
      - name: Run lint
        run: gradle :app:lintDebug --stacktrace
        env:
          CI: true
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
        env:
          CI: true
      - name: Run Android cold-start instrumentation test
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          script: |
            adb devices
            gradle :app:connectedDebugAndroidTest --stacktrace
        env:
          CI: true
      - name: Collect Android diagnostics
        if: always()
        run: |
          set +e
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          commands = [
              ("adb-devices.txt", ["adb", "devices", "-l"], 20),
              ("android-logcat.txt", ["adb", "logcat", "-d"], 30),
              ("android-exit-info.txt", ["adb", "shell", "dumpsys", "activity", "exit-info", "com.aistudio.haritalar.navtr"], 20),
          ]
          for filename, command, timeout_seconds in commands:
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=timeout_seconds)
                  output = (result.stdout or "") + (result.stderr or "")
                  Path(filename).write_text(output, encoding="utf-8")
              except subprocess.TimeoutExpired as exc:
                  output = (exc.stdout or b"").decode(errors="replace") if isinstance(exc.stdout, bytes) else (exc.stdout or "")
                  output += (exc.stderr or b"").decode(errors="replace") if isinstance(exc.stderr, bytes) else (exc.stderr or "")
                  output += f"\nCOMMAND_TIMEOUT after {timeout_seconds}s: {' '.join(command)}\n"
                  Path(filename).write_text(output, encoding="utf-8")
              except Exception as exc:
                  Path(filename).write_text(f"COMMAND_ERROR: {exc}\n", encoding="utf-8")
          print("Diagnostics collection completed.")
          PY
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lanu-harita-android-diagnostics
          path: |
            adb-devices.txt
            android-logcat.txt
            android-exit-info.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        env:
          CI: true
      - name: Verify APK SHA-256 and published signing identity
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$apk" | tee apk-sha256.txt
          apksigner_bin="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_bin"
          "$apksigner_bin" verify --print-certs "$apk" > apk-certificate-output.txt
          fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-certificate-output.txt | head -n 1)"
          test -n "$fingerprint" || { echo "ERROR: APK signer certificate fingerprint missing"; exit 1; }
          {
            echo "source=${APK_SIGNING_SOURCE}"
            echo "signer_certificate_sha256=${fingerprint}"
            echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f 1)"
            echo "Note: debug APK updates require SAME signer certificate as existing installation."
          } > apk-signing-info.txt
          echo "APK signature fingerprint verified and published: ${fingerprint}"
          rm apk-certificate-output.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lanu-harita-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt
            apk-signing-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish immutable versioned APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version"
          tag="v${version}"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum -c apk-sha256.txt

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable versioned release $tag already exists: retaining published assets."
          else
            gh release create "$tag" "$apk" apk-sha256.txt apk-signing-info.txt \
              --target "$GITHUB_SHA" \
              --title "LANU Harita ${version} APK" \
              --notes "Sürüme özel Android APK ve SHA-256. Debug imzası her CI derlemesinde yeniden üretiliyorsa önceki APK üzerine doğrudan güncelleme desteklenmeyebilir."

          fi

          # Verify actual published assets on every run, including existing immutable tags.
          verify_dir="${RUNNER_TEMP}/lanu-version-release-check"
          mkdir -p "$verify_dir"
          gh release download "$tag" --pattern 'app-debug.apk' --dir "$verify_dir"
          gh release download "$tag" --pattern 'apk-sha256.txt' --dir "$verify_dir"
          gh release download "$tag" --pattern 'apk-signing-info.txt' --dir "$verify_dir"
          expected="$(cut -d ' ' -f 1 "$verify_dir/apk-sha256.txt")"
          actual="$(sha256sum "$verify_dir/app-debug.apk" | awk '{print $1}')"
          test "$actual" = "$expected" || {
            echo "ERROR: Versioned APK does not match its published SHA-256 after download"
            exit 1
          }
          downloaded_cert="$("$apksigner_bin" verify --print-certs "$verify_dir/app-debug.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          published_cert="$(sed -n 's/^signer_certificate_sha256=//p' "$verify_dir/apk-signing-info.txt" | head -n 1)"
          test -n "$downloaded_cert" && test "$downloaded_cert" = "$published_cert" || {
            echo "ERROR: Downloaded APK certificate does not match published signing identity"
            exit 1
          }
          echo "Versioned APK checksum and signing fingerprint verified: $tag"
          gh release view "$tag" --json assets --jq '.assets[] | select(.name == "app-debug.apk" and .size > 0)' | grep -q 'app-debug.apk'
          gh release view "$tag" --json assets --jq '.assets[] | select(.name == "apk-sha256.txt" and .size > 0)' | grep -q 'apk-sha256.txt'
          gh release view "$tag" --json assets --jq '.assets[] | select(.name == "apk-signing-info.txt" and .size > 0)' | grep -q 'apk-signing-info.txt'
      - name: Remove previous latest Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.assets[] | select(.name == "app-debug.apk") | .id' | head -n 1)"
          if [ -n "${asset_id}" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            echo "Removed previous app-debug.apk release asset: ${asset_id}"
          else
            echo 'No previous app-debug.apk release asset found.'
          fi
      - name: Publish APK to latest GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: latest
          name: LANU Harita — Latest APK
          body: |
            Bu yayın her başarılı Android APK derlemesinde güncellenir.

            **Güncel APK:** `app-debug.apk`
            **Checksum:** `apk-sha256.txt`
            **Signing certificate:** `apk-signing-info.txt` (does not include a private key)
          files: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt
            apk-signing-info.txt
          make_latest: true
          prerelease: false
          draft: false
