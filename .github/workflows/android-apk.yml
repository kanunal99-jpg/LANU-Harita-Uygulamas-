name: Android APK

# Build/publish trigger for the current navigation build.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
        env:
          CI: true

      - name: Create Android debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        env:
          CI: true

      - name: Publish latest APK into repository
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/*.apk downloads/LANU-Harita-latest.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/LANU-Harita-latest.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged; no repository commit needed.'
          else
            git commit -m 'build: publish latest LANU Harita APK [skip ci]'
            git push
          fi

      - name: Publish APK to latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LANU Harita — Latest APK
          body: |
            Bu yayın her başarılı Android APK derlemesinde güncellenir.

            **Güncel APK:** `LANU-Harita-latest.apk`
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
          prerelease: false
          draft: false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanu-harita-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
