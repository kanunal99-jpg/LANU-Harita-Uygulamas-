name: Consolidate final hardening

on:
  push:
    branches:
      - feat/consolidated-final-hardening

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final product hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          hud = Path('app/src/main/java/com/example/haritalar/ui/DrivingHud.kt')
          h = hud.read_text(encoding='utf-8')
          old = '    val speedLimit = progress.speedLimitKmh ?: 50\n    val isOverSpeed = speedKmh > (speedLimit + 5)\n'
          new = '    val speedLimit = progress.speedLimitKmh\n    val isOverSpeed = speedLimit != null && speedKmh > (speedLimit + 5)\n'
          if old not in h:
              raise SystemExit('DrivingHud synthetic speed-limit fallback not found')
          h = h.replace(old, new, 1)
          h = h.replace('                                text = "$speedLimit",\n', '                                text = speedLimit?.toString() ?: "—",\n', 1)
          h = h.replace('text = "${Math.round(speedKmh)} km/s",', 'text = "${Math.round(speedKmh)} km/h",', 1)
          hud.write_text(h, encoding='utf-8')

          radar = Path('app/src/main/java/com/example/haritalar/ui/RadarWarningCard.kt')
          r = radar.read_text(encoding='utf-8')
          r = r.replace(
              'fun RadarWarningCard(\n    camera: SafetyCamera?,\n    modifier: Modifier = Modifier\n)',
              'fun RadarWarningCard(\n    camera: SafetyCamera?,\n    distanceBucketMeters: Int? = null,\n    speedLimitKmh: Int? = null,\n    overspeed: Boolean = false,\n    modifier: Modifier = Modifier\n)',
              1,
          )
          r = r.replace(
              '                        Text(\n                            text = "RADAR NOKTASI",',
              '                        Text(\n                            text = if (overspeed) "DİKKAT: HIZ SINIRI AŞILDI" else "RADAR NOKTASI",',
              1,
          )
          old_block = '''                        if (!camera.maxSpeed.isNullOrBlank()) {
                            Text(
                                text = "Hız Sınırı: ${camera.maxSpeed} km/h",
                                color = Color.White.copy(alpha = 0.9f),
                                fontSize = 14.sp
                            )
                        } else {
                            Text(
                                text = "Sabit Hız Kamerası",
                                color = Color.White.copy(alpha = 0.9f),
                                fontSize = 14.sp
                            )
                        }
'''
          new_block = '''                        distanceBucketMeters?.let { bucket ->
                            Text(
                                text = when {
                                    bucket >= 1000 && bucket % 1000 == 0 -> "${bucket / 1000} kilometre ileride"
                                    bucket >= 1000 -> "${bucket / 1000.0} kilometre ileride".replace('.', ',')
                                    else -> "$bucket metre ileride"
                                },
                                color = Color.White.copy(alpha = 0.95f),
                                fontWeight = FontWeight.SemiBold,
                                fontSize = 14.sp
                            )
                        }
                        if (speedLimitKmh != null) {
                            Text(
                                text = "Hız sınırı: $speedLimitKmh km/h",
                                color = Color.White.copy(alpha = 0.9f),
                                fontSize = 13.sp
                            )
                        } else {
                            Text(
                                text = "Hız limiti verisi doğrulanamadı",
                                color = Color.White.copy(alpha = 0.9f),
                                fontSize = 13.sp
                            )
                        }
'''
          if old_block not in r:
              raise SystemExit('RadarWarningCard old speed block not found')
          r = r.replace(old_block, new_block, 1)
          radar.write_text(r, encoding='utf-8')

          vm = Path('app/src/main/java/com/example/haritalar/ui/MainViewModel.kt')
          v = vm.read_text(encoding='utf-8')
          v = v.replace(
              '    val approachingCamera: com.example.haritalar.model.SafetyCamera? = null,\n',
              '    val approachingCamera: com.example.haritalar.model.SafetyCamera? = null,\n    val approachingCameraDistanceBucketMeters: Int? = null,\n    val approachingCameraSpeedLimitKmh: Int? = null,\n    val approachingCameraOverspeed: Boolean = false,\n',
              1,
          )
          v = v.replace(
              '_uiState.value = _uiState.value.copy(approachingCamera = null)',
              '_uiState.value = _uiState.value.copy(approachingCamera = null, approachingCameraDistanceBucketMeters = null, approachingCameraSpeedLimitKmh = null, approachingCameraOverspeed = false)',
          )
          v = v.replace(
              '_uiState.value = _uiState.value.copy(approachingCamera = camera)',
              '_uiState.value = _uiState.value.copy(approachingCamera = camera, approachingCameraDistanceBucketMeters = warning.distanceBucketMeters.takeIf { it > 0 }, approachingCameraSpeedLimitKmh = warning.speedLimitKmh, approachingCameraOverspeed = warning.overspeed)',
              1,
          )
          vm.write_text(v, encoding='utf-8')

          activity = Path('app/src/main/java/com/example/MainActivity.kt')
          a = activity.read_text(encoding='utf-8')
          a = a.replace(
              '            RadarWarningCard(\n                camera = uiState.approachingCamera,\n',
              '            RadarWarningCard(\n                camera = uiState.approachingCamera,\n                distanceBucketMeters = uiState.approachingCameraDistanceBucketMeters,\n                speedLimitKmh = uiState.approachingCameraSpeedLimitKmh,\n                overspeed = uiState.approachingCameraOverspeed,\n',
              1,
          )
          activity.write_text(a, encoding='utf-8')

          docs = Path('docs/PRODUCTION_READINESS.md')
          d = docs.read_text(encoding='utf-8')
          marker = '- Android lint, unit tests, emulator instrumentation and debug APK CI gates.\n'
          addition = '''- Safety-camera warnings integrated into navigation: real source data only, 5 km envelope, 500 m TTS buckets, overspeed TTS/visual alert, and session reset.\n- Dashboard speed display uses km/h and never invents a speed limit when source data is unavailable.\n'''
          if addition not in d:
              d = d.replace(marker, marker + addition, 1)
          docs.write_text(d, encoding='utf-8')

          # Remove temporary workflow/marker from the consolidated branch before commit.
          Path('.github/workflows/consolidate-final-hardening.yml').unlink()
          marker_file = Path('.consolidated-final-start')
          if marker_file.exists():
              marker_file.unlink()

          assert 'progress.speedLimitKmh ?: 50' not in hud.read_text(encoding='utf-8')
          assert 'km/s' not in hud.read_text(encoding='utf-8')
          assert 'approachingCameraOverspeed' in vm.read_text(encoding='utf-8')
          assert 'distanceBucketMeters' in radar.read_text(encoding='utf-8')
          print('Final product hardening applied.')
          PY

      - name: Validate and test
        run: |
          set -euo pipefail
          git diff --check
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Commit final consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: consolidate final navigation product hardening'
          git push origin HEAD:feat/consolidated-final-hardening
