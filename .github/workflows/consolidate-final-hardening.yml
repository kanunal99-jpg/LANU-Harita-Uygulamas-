import com.example.haritalar.data.network.SafetyCameraService
import com.example.haritalar.model.GeoPoint
import com.example.haritalar.model.SafetyCamera
import com.example.haritalar.model.SafetyCameraBoundingBox
import com.example.haritalar.model.SafetyCameraFetchResult
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.sync.Mutex
import kotlinx.coroutines.sync.withLock
import kotlinx.coroutines.withContext
import kotlin.math.abs
import kotlin.math.cos
import kotlin.math.PI

/**
 * Runtime source/cache boundary for speed-camera warnings.
 * Primary/alternative Overpass endpoints are handled by SafetyCameraService;
 * this layer retains the last verified result as a stale-safe fallback.
 */
class SafetyCameraRepository(
    private val service: SafetyCameraService = SafetyCameraService(),
    private val nowMs: () -> Long = System::currentTimeMillis
) {
    companion object {
        private const val FRESH_CACHE_MS = 120_000L
        private const val STALE_CACHE_MS = 900_000L
        private const val MIN_MOVE_TO_REFRESH_METERS = 900.0
        private const val SEARCH_RADIUS_METERS = 5_500.0
    }

    private val mutex = Mutex()
    private var cachedCameras: List<SafetyCamera> = emptyList()
    private var cacheCenter: GeoPoint? = null
    private var cacheTimestampMs: Long = 0L

    suspend fun getNearbyCameras(center: GeoPoint): List<SafetyCamera> = withContext(Dispatchers.IO) {
        mutex.withLock {
            val now = nowMs()
            val centerDistance = cacheCenter?.distanceTo(center) ?: Double.MAX_VALUE
            if (cachedCameras.isNotEmpty() &&
                now - cacheTimestampMs <= FRESH_CACHE_MS &&
                centerDistance < MIN_MOVE_TO_REFRESH_METERS
            ) {
                return@withLock cachedCameras
            }

            val bbox = boundingBox(center, SEARCH_RADIUS_METERS)
            when (val result = service.fetchSpeedCamerasInBoundingBox(bbox, maxCameras = 250)) {
                is SafetyCameraFetchResult.Success -> {
                    cachedCameras = result.cameras
                    cacheCenter = center
                    cacheTimestampMs = now
                    result.cameras
                }
                is SafetyCameraFetchResult.Error -> {
                    if (cachedCameras.isNotEmpty() && now - cacheTimestampMs <= STALE_CACHE_MS) {
                        cachedCameras.filter { it.point.distanceTo(center) <= SEARCH_RADIUS_METERS + 500.0 }
                    } else {
                        emptyList()
                    }
                }
            }
        }
    }

    internal fun boundingBox(center: GeoPoint, radiusMeters: Double): SafetyCameraBoundingBox {
        val latDelta = radiusMeters / 111_000.0
        val cosLat = cos(center.latitude * PI / 180.0).coerceAtLeast(0.01)
        val lonDelta = radiusMeters / (111_000.0 * cosLat)
        return SafetyCameraBoundingBox(
            south = (center.latitude - latDelta).coerceIn(-90.0, 90.0),
            west = (center.longitude - lonDelta).coerceIn(-180.0, 180.0),
            north = (center.latitude + latDelta).coerceIn(-90.0, 90.0),
            east = (center.longitude + lonDelta).coerceIn(-180.0, 180.0)
        )
    }
}
''', encoding='utf-8')

