name: P1 Professional PR Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - server/**
      - docs/**
      - ANAYASA.md
      - README.md
      - metadata.json
      - .github/scripts/**
      - .github/workflows/p1-professional-pr.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enforce LANU constitution
        run: bash .github/scripts/constitution-quality-gate.sh
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.3.1'
      - name: Create Android debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
        env:
          CI: true
      - name: Run lint
        run: gradle :app:lintDebug --stacktrace
        env:
          CI: true
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        env:
          CI: true

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: node --check src/server.mjs
