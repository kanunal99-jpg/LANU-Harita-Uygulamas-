name: Apply audit hardening

on:
  push:
    branches: [feat/audit-truthfulness-hardening]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply remaining routing hardening
        shell: python3 {0}
        run: |
          from pathlib import Path

          routing = Path("app/src/main/java/com/example/haritalar/data/network/RoutingProviders.kt")
          text = routing.read_text()

          old_valhalla = '''                val decodedGeometry = if (encodedShape.isNotEmpty()) {
                    PolylineDecoder.decodePolyline6(encodedShape)
                } else {
                    listOf(start, end)
                }
'''
          new_valhalla = '''                val decodedGeometry = if (encodedShape.isNotEmpty()) {
                    PolylineDecoder.decodePolyline6(encodedShape)
                } else {
                    emptyList()
                }
                if (decodedGeometry.size < 2) return null
'''
          if old_valhalla in text:
              text = text.replace(old_valhalla, new_valhalla, 1)
          elif "if (decodedGeometry.size < 2) return null" not in text:
              raise SystemExit("Valhalla geometry fallback state is unexpected")

          old_osrm = '''                    if (coords != null) {
                        for (c in 0 until coords.length()) {
                            val pt = coords.getJSONArray(c)
                            geometryPoints.add(GeoPoint(pt.getDouble(1), pt.getDouble(0)))
                        }
                    }

                    val legs = r.optJSONArray("legs")
'''
          new_osrm = '''                    if (coords != null) {
                        for (c in 0 until coords.length()) {
                            val pt = coords.getJSONArray(c)
                            geometryPoints.add(GeoPoint(pt.getDouble(1), pt.getDouble(0)))
                        }
                    }
                    if (geometryPoints.size < 2) continue

                    val legs = r.optJSONArray("legs")
'''
          if old_osrm in text:
              text = text.replace(old_osrm, new_osrm, 1)
          elif "if (geometryPoints.size < 2) continue" not in text:
              raise SystemExit("OSRM geometry validation state is unexpected")

          text = text.replace(
              "geometry = if (geometryPoints.isNotEmpty()) geometryPoints else listOf(start, end),",
              "geometry = geometryPoints,",
              1
          )
          routing.write_text(text)

          # Keep the temporary workflow itself clean and remove it after this run.
          manifest = Path("app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          if 'android:usesCleartextTraffic="true"' in m:
              manifest.write_text(m.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"', 1))

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/haritalar/data/network/RoutingProviders.kt app/src/main/AndroidManifest.xml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "fix: reject invalid routing geometry"
          git push
