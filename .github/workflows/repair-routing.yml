name: Focused routing repair
on:
  push:
    branches: [feat/audit-truthfulness-hardening]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair invalid route geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/haritalar/data/network/RoutingProviders.kt')
          s = p.read_text()
          s = s.replace('''                val decodedGeometry = if (encodedShape.isNotEmpty()) {\n                    PolylineDecoder.decodePolyline6(encodedShape)\n                } else {\n                    listOf(start, end)\n                }''', '''                val decodedGeometry = if (encodedShape.isNotEmpty()) {\n                    PolylineDecoder.decodePolyline6(encodedShape)\n                } else {\n                    emptyList()\n                }\n                if (decodedGeometry.size < 2) return null''', 1)
          s = s.replace('''                    if (coords != null) {\n                        for (c in 0 until coords.length()) {\n                            val pt = coords.getJSONArray(c)\n                            geometryPoints.add(GeoPoint(pt.getDouble(1), pt.getDouble(0)))\n                        }\n                    }\n\n                    val legs = r.optJSONArray("legs")''', '''                    if (coords != null) {\n                        for (c in 0 until coords.length()) {\n                            val pt = coords.getJSONArray(c)\n                            geometryPoints.add(GeoPoint(pt.getDouble(1), pt.getDouble(0)))\n                        }\n                    }\n                    if (geometryPoints.size < 2) continue\n\n                    val legs = r.optJSONArray("legs")''', 1)
          s = s.replace('geometry = if (geometryPoints.isNotEmpty()) geometryPoints else listOf(start, end),', 'geometry = geometryPoints,', 1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/example/haritalar/data/network/RoutingProviders.kt')
          p.write_text('\n'.join(x.rstrip() for x in p.read_text().splitlines())+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/haritalar/data/network/RoutingProviders.kt
          git diff --cached --check
          git commit -m 'fix: reject invalid routing geometry' || exit 0
          git push
