name: Consolidate truthful speed limit HUD

on:
  push:
    branches:
      - fix/truthful-speed-limit-hud

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove synthetic dashboard speed limit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/haritalar/ui/DrivingHud.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    val speedLimit = progress.speedLimitKmh ?: 50\n', '    val speedLimit = progress.speedLimitKmh\n', 1)
          text = text.replace('    val isOverSpeed = speedKmh > (speedLimit + 5)\n', '    val isOverSpeed = speedLimit != null && speedKmh > (speedLimit + 5)\n', 1)
          text = text.replace('                                text = "$speedLimit",\n', '                                text = speedLimit?.toString() ?: "—",\n', 1)
          if 'progress.speedLimitKmh ?: 50' in text:
              raise SystemExit('Synthetic speed limit still present')
          if 'val speedLimit = progress.speedLimitKmh\n' not in text:
              raise SystemExit('Truthful speed limit declaration missing')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/consolidate-speed-hud.yml
          git add app/src/main/java/com/example/haritalar/ui/DrivingHud.kt .github/workflows/consolidate-speed-hud.yml
          git commit -m 'fix: never fabricate dashboard speed limit'
          git push origin HEAD:fix/truthful-speed-limit-hud
