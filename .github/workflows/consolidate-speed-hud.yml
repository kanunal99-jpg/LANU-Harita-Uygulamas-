name: Consolidate truthful speed limit HUD

on:
  push:
    branches:
      - fix/truthful-speed-limit-hud

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove synthetic dashboard speed limit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/haritalar/ui/DrivingHud.kt')
          text = path.read_text(encoding='utf-8')
          old_limit = '    val speedLimit = progress.speedLimitKmh ?: 50\n'
          new_limit = '    val speedLimit = progress.speedLimitKmh\n'
          if old_limit not in text:
              raise SystemExit('Synthetic speed limit line not found exactly once')
          text = text.replace(old_limit, new_limit, 1)

          old_over = '    val isOverSpeed = speedKmh > (speedLimit + 5)\n'
          new_over = '    val isOverSpeed = speedLimit != null && speedKmh > (speedLimit + 5)\n'
          if old_over not in text:
              raise SystemExit('Overspeed expression not found exactly once')
          text = text.replace(old_over, new_over, 1)

          old_display = '                                text = "$speedLimit",\n'
          new_display = '                                text = speedLimit?.toString() ?: "—",\n'
          if old_display not in text:
              raise SystemExit('Speed limit display line not found exactly once')
          text = text.replace(old_display, new_display, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          set -euo pipefail
          grep -q 'val speedLimit = progress.speedLimitKmh$' app/src/main/java/com/example/haritalar/ui/DrivingHud.kt
          grep -q 'val isOverSpeed = speedLimit != null && speedKmh > (speedLimit + 5)' app/src/main/java/com/example/haritalar/ui/DrivingHud.kt
          grep -q 'text = speedLimit?.toString() ?: "—"' app/src/main/java/com/example/haritalar/ui/DrivingHud.kt
          ! grep -q 'progress.speedLimitKmh ?: 50' app/src/main/java/com/example/haritalar/ui/DrivingHud.kt
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/consolidate-speed-hud.yml
          git add app/src/main/java/com/example/haritalar/ui/DrivingHud.kt .github/workflows/consolidate-speed-hud.yml
          git commit -m 'fix: never fabricate dashboard speed limit'
          git push origin HEAD:fix/truthful-speed-limit-hud
