name: Apply safety runtime consolidation retry

on:
  push:
    branches:
      - feat/consolidated-final-product-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch and test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          vm=Path('app/src/main/java/com/example/haritalar/ui/MainViewModel.kt'); s=vm.read_text()
          def r(a,b):
              global s
              assert a in s, a[:80]
              s=s.replace(a,b,1)
          r('import com.example.haritalar.data.repository.TrafficSignalRepository\n','import com.example.haritalar.data.repository.TrafficSignalRepository\nimport com.example.haritalar.data.repository.SafetyCameraRepository\n')
          r('import com.example.haritalar.model.SearchResult\n','import com.example.haritalar.model.SearchResult\nimport com.example.haritalar.model.SafetyCamera\n')
          r('    val isSafetyCamerasLayerVisible: Boolean = true,\n    val approachingCamera: com.example.haritalar.model.SafetyCamera? = null,\n','    val isSafetyCamerasLayerVisible: Boolean = true,\n    val safetyCameras: List<SafetyCamera> = emptyList(),\n    val approachingCamera: SafetyCamera? = null,\n')
          r('    val weatherRepository = com.example.haritalar.data.weather.WeatherRepository()\n','    val weatherRepository = com.example.haritalar.data.weather.WeatherRepository()\n    val safetyCameraRepository = SafetyCameraRepository()\n')
          r('    private var trafficSignalJob: Job? = null\n    private var generationCounter = 1L\n','    private var trafficSignalJob: Job? = null\n    private var safetyCameraRefreshJob: Job? = null\n    private var lastSafetyCameraRefreshPoint: GeoPoint? = null\n    private var lastSafetyCameraRefreshAt = 0L\n    private var generationCounter = 1L\n')
          old='''                        _uiState.value = _uiState.value.copy(\n                            userLocation = displayLoc,\n                            vehicleHeadingState = headingState,\n                            navigationProgress = progress,\n                            departureGuidance = currentDep,\n                            isWrongWay = wrongWay\n                        )\n'''
          r(old,old+'                        refreshSafetyCamerasIfNeeded(displayLoc)\n                        checkSafetyCameraProximity(_uiState.value.safetyCameras)\n')
          r('    private fun startNavigationInternal(route: RouteOption, userLocation: UserLocationData) {\n','    private fun startNavigationInternal(route: RouteOption, userLocation: UserLocationData) {\n        lastSafetyCameraRefreshPoint = null\n        lastSafetyCameraRefreshAt = 0L\n')
          r('        trafficRefreshJob?.cancel()\n        ttsManager.stop()\n        announcedCameraWarningBuckets.clear()\n        lastOverspeedCameraWarningKey = null\n','        trafficRefreshJob?.cancel()\n        safetyCameraRefreshJob?.cancel()\n        safetyCameraRefreshJob = null\n        ttsManager.stop()\n        announcedCameraWarningBuckets.clear()\n        lastOverspeedCameraWarningKey = null\n')
          r('            isWrongWay = false, isLoadingRoutes = false\n        )\n','            isWrongWay = false, isLoadingRoutes = false, safetyCameras = emptyList(), approachingCamera = null\n        )\n')
          r('''        if (!newVisible) {\n            announcedCameraWarningBuckets.clear()\n            lastOverspeedCameraWarningKey = null\n        }\n    }\n\n    private var lastAnnouncedWeatherId: String? = null\n''','''        if (!newVisible) {\n            safetyCameraRefreshJob?.cancel()\n            safetyCameraRefreshJob = null\n            lastSafetyCameraRefreshPoint = null\n            lastSafetyCameraRefreshAt = 0L\n            announcedCameraWarningBuckets.clear()\n            lastOverspeedCameraWarningKey = null\n            _uiState.value = _uiState.value.copy(safetyCameras = emptyList(), approachingCamera = null)\n        } else {\n            currentRoutingLocation()?.let { refreshSafetyCamerasIfNeeded(it, force = true) }\n        }\n    }\n\n    private var lastAnnouncedWeatherId: String? = null\n''')
          marker='    private fun formatSafetyWarningDistance(distanceBucketMeters: Int): String = when {\n'
          helper='''    private fun refreshSafetyCamerasIfNeeded(location: UserLocationData, force: Boolean = false) {\n        if (!_uiState.value.isSafetyCamerasLayerVisible || _uiState.value.navigationState != NavigationState.NAVIGATING) return\n        val now = System.currentTimeMillis()\n        val movedMeters = lastSafetyCameraRefreshPoint?.distanceTo(location.point) ?: Double.MAX_VALUE\n        if (!force && now - lastSafetyCameraRefreshAt < 45_000L && movedMeters < 750.0) return\n        lastSafetyCameraRefreshAt = now\n        lastSafetyCameraRefreshPoint = location.point\n        safetyCameraRefreshJob?.cancel()\n        safetyCameraRefreshJob = viewModelScope.launch {\n            val cameras = safetyCameraRepository.getNearbyCameras(location.point)\n            if (_uiState.value.navigationState == NavigationState.NAVIGATING && _uiState.value.isSafetyCamerasLayerVisible) {\n                _uiState.value = _uiState.value.copy(safetyCameras = cameras)\n                checkSafetyCameraProximity(cameras)\n            }\n        }\n    }\n\n'''
          r(marker,helper+marker)
          r('        routeCalculationJob?.cancel()\n        vehicleHeadingManager.stop()\n','        routeCalculationJob?.cancel()\n        safetyCameraRefreshJob?.cancel()\n        vehicleHeadingManager.stop()\n')
          vm.write_text(s)

          hud=Path('app/src/main/java/com/example/haritalar/ui/DrivingHud.kt'); h=hud.read_text()
          h=h.replace('    val speedLimit = progress.speedLimitKmh ?: 50\n    val isOverSpeed = speedKmh > (speedLimit + 5)\n','    val speedLimit = progress.speedLimitKmh\n    val isOverSpeed = speedLimit != null && speedKmh > (speedLimit + 5)\n',1)
          h=h.replace('                                text = "$speedLimit",\n','                                text = speedLimit?.toString() ?: "—",\n',1); hud.write_text(h)

          repo=Path('app/src/main/java/com/example/haritalar/data/repository/SafetyCameraRepository.kt')
          repo.parent.mkdir(parents=True,exist_ok=True)
          repo.write_text('''package com.example.haritalar.data.repository\n\nimport com.example.haritalar.data.network.SafetyCameraService\nimport com.example.haritalar.model.GeoPoint\nimport com.example.haritalar.model.SafetyCamera\nimport com.example.haritalar.model.SafetyCameraBoundingBox\nimport com.example.haritalar.model.SafetyCameraFetchResult\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.sync.Mutex\nimport kotlinx.coroutines.sync.withLock\nimport kotlinx.coroutines.withContext\nimport kotlin.math.PI\nimport kotlin.math.cos\n\nclass SafetyCameraRepository(private val service: SafetyCameraService = SafetyCameraService(), private val nowMs: () -> Long = System::currentTimeMillis) {\n    private val mutex=Mutex(); private var cached=emptyList<SafetyCamera>(); private var cachedCenter:GeoPoint?=null; private var cachedAt=0L\n    suspend fun getNearbyCameras(point:GeoPoint):List<SafetyCamera>=withContext(Dispatchers.IO){mutex.withLock{\n        val now=nowMs(); val moved=cachedCenter?.distanceTo(point)?:Double.MAX_VALUE\n        if(cached.isNotEmpty()&&now-cachedAt<=120000L&&moved<900.0)return@withLock cached\n        val radius=5500.0; val latDelta=radius/111000.0; val cosLat=cos(point.latitude*PI/180.0).coerceAtLeast(0.01); val lonDelta=radius/(111000.0*cosLat)\n        val box=SafetyCameraBoundingBox((point.latitude-latDelta).coerceIn(-90.0,90.0),(point.longitude-lonDelta).coerceIn(-180.0,180.0),(point.latitude+latDelta).coerceIn(-90.0,90.0),(point.longitude+lonDelta).coerceIn(-180.0,180.0))\n        when(val result=service.fetchSpeedCamerasInBoundingBox(box,250)){\n            is SafetyCameraFetchResult.Success->{cached=result.cameras;cachedCenter=point;cachedAt=now;result.cameras}\n            is SafetyCameraFetchResult.Error->{if(cached.isNotEmpty()&&now-cachedAt<=900000L)cached.filter{it.point.distanceTo(point)<=6000.0}else emptyList()}\n        }\n    }}\n}\n''')
          docs=Path('docs/PRODUCTION_READINESS.md'); d=docs.read_text(); d=d.replace('- Safety-camera warnings use real source data only, a 5 km warning envelope, 500 m TTS buckets and navigation-session reset behavior.','- Safety-camera warnings use real OpenStreetMap/Overpass source data, a verified in-memory stale-cache fallback, a 5 km warning envelope, 500 m TTS buckets and navigation-session reset behavior.'); docs.write_text(d)
          PY
          gradle :app:testDebugUnitTest --no-daemon
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-safety-runtime.yml .github/workflows/apply-safety-runtime-2.yml .github/workflows/final-hardening-apply.yml .github/workflows/consolidate-final-hardening.yml .github/workflows/final-hardening-apply.yml
          git add app/src/main/java/com/example/haritalar/data/repository/SafetyCameraRepository.kt app/src/main/java/com/example/haritalar/ui/MainViewModel.kt app/src/main/java/com/example/haritalar/ui/DrivingHud.kt docs/PRODUCTION_READINESS.md .github/workflows
          git commit -m 'fix: consolidate final safety runtime hardening'
          git push origin HEAD:feat/consolidated-final-product-hardening
