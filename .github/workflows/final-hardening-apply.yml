name: Apply final hardening

on:
  push:
    branches:
      - feat/consolidated-final-product-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          repo=Path('.')
          p=repo/'app/src/main/java/com/example/haritalar/data/repository/SafetyCameraRepository.kt'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('''package com.example.haritalar.data.repository

import com.example.haritalar.data.network.SafetyCameraService
import com.example.haritalar.model.GeoPoint
import com.example.haritalar.model.SafetyCamera
import com.example.haritalar.model.SafetyCameraBoundingBox
import com.example.haritalar.model.SafetyCameraFetchResult
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.sync.Mutex
import kotlinx.coroutines.sync.withLock
import kotlinx.coroutines.withContext
import kotlin.math.PI
import kotlin.math.cos

class SafetyCameraRepository(private val service: SafetyCameraService = SafetyCameraService(), private val nowMs: () -> Long = System::currentTimeMillis) {
    private val mutex=Mutex(); private var cached=emptyList<SafetyCamera>(); private var center:GeoPoint?=null; private var cachedAt=0L
    suspend fun getNearbyCameras(point:GeoPoint):List<SafetyCamera>=withContext(Dispatchers.IO){mutex.withLock{val now=nowMs(); val moved=center?.distanceTo(point)?:Double.MAX_VALUE
        if(cached.isNotEmpty()&&now-cachedAt<=120000L&&moved<900.0)return@withLock cached
        val r=5500.0; val la=r/111000.0; val lo=r/(111000.0*cos(point.latitude*PI/180.0).coerceAtLeast(0.01)); val box=SafetyCameraBoundingBox((point.latitude-la).coerceIn(-90.0,90.0),(point.longitude-lo).coerceIn(-180.0,180.0),(point.latitude+la).coerceIn(-90.0,90.0),(point.longitude+lo).coerceIn(-180.0,180.0))
        when(val x=service.fetchSpeedCamerasInBoundingBox(box,250)){is SafetyCameraFetchResult.Success->{cached=x.cameras;center=point;cachedAt=now;x.cameras};is SafetyCameraFetchResult.Error->{if(cached.isNotEmpty()&&now-cachedAt<=900000L)cached.filter{it.point.distanceTo(point)<=6000.0}else emptyList()}}}}
}
''',encoding='utf-8')
          f=repo/'app/src/main/java/com/example/haritalar/ui/MainViewModel.kt'; s=f.read_text(encoding='utf-8')
          def r(a,b,n):
              global s
              if a not in s: raise SystemExit(n)
              s=s.replace(a,b,1)
          r('import com.example.haritalar.data.repository.TrafficSignalRepository\n','import com.example.haritalar.data.repository.TrafficSignalRepository\nimport com.example.haritalar.data.repository.SafetyCameraRepository\n','import')
          r('import com.example.haritalar.model.SearchResult\n','import com.example.haritalar.model.SearchResult\nimport com.example.haritalar.model.SafetyCamera\n','model')
          r('    val isSafetyCamerasLayerVisible: Boolean = true,\n    val approachingCamera: com.example.haritalar.model.SafetyCamera? = null,\n','    val isSafetyCamerasLayerVisible: Boolean = true,\n    val safetyCameras: List<SafetyCamera> = emptyList(),\n    val approachingCamera: SafetyCamera? = null,\n','state')
          r('    val weatherRepository = com.example.haritalar.data.weather.WeatherRepository()\n','    val weatherRepository = com.example.haritalar.data.weather.WeatherRepository()\n    val safetyCameraRepository = SafetyCameraRepository()\n','repo field')
          r('    private var trafficSignalJob: Job? = null\n    private var generationCounter = 1L\n','    private var trafficSignalJob: Job? = null\n    private var safetyCameraRefreshJob: Job? = null\n    private var lastSafetyCameraRefreshPoint: GeoPoint? = null\n    private var lastSafetyCameraRefreshAt = 0L\n    private var generationCounter = 1L\n','refresh fields')
          r('''                        _uiState.value = _uiState.value.copy(\n                            userLocation = displayLoc,\n                            vehicleHeadingState = headingState,\n                            navigationProgress = progress,\n                            departureGuidance = currentDep,\n                            isWrongWay = wrongWay\n                        )\n''','''                        _uiState.value = _uiState.value.copy(\n                            userLocation = displayLoc,\n                            vehicleHeadingState = headingState,\n                            navigationProgress = progress,\n                            departureGuidance = currentDep,\n                            isWrongWay = wrongWay\n                        )\n                        refreshSafetyCamerasIfNeeded(displayLoc)\n                        checkSafetyCameraProximity(_uiState.value.safetyCameras)\n''','location')
          r('    private fun startNavigationInternal(route: RouteOption, userLocation: UserLocationData) {\n','    private fun startNavigationInternal(route: RouteOption, userLocation: UserLocationData) {\n        lastSafetyCameraRefreshPoint=null\n        lastSafetyCameraRefreshAt=0L\n','start')
          r('''        trafficRefreshJob?.cancel()\n        ttsManager.stop()\n        announcedCameraWarningBuckets.clear()\n        lastOverspeedCameraWarningKey = null\n''','''        trafficRefreshJob?.cancel()\n        safetyCameraRefreshJob?.cancel()\n        safetyCameraRefreshJob=null\n        ttsManager.stop()\n        announcedCameraWarningBuckets.clear()\n        lastOverspeedCameraWarningKey = null\n''','stop')
          r('            isWrongWay = false, isLoadingRoutes = false\n        )\n','            isWrongWay = false, isLoadingRoutes = false, safetyCameras = emptyList(), approachingCamera = null\n        )\n','clear state')
          r('''        if (!newVisible) {\n            announcedCameraWarningBuckets.clear()\n            lastOverspeedCameraWarningKey = null\n        }\n    }\n\n    private var lastAnnouncedWeatherId: String? = null\n''','''        if (!newVisible) {\n            safetyCameraRefreshJob?.cancel()\n            safetyCameraRefreshJob=null\n            lastSafetyCameraRefreshPoint=null\n            lastSafetyCameraRefreshAt=0L\n            announcedCameraWarningBuckets.clear()\n            lastOverspeedCameraWarningKey = null\n            _uiState.value=_uiState.value.copy(safetyCameras=emptyList(),approachingCamera=null)\n        } else currentRoutingLocation()?.let{refreshSafetyCamerasIfNeeded(it,force=true)}\n    }\n\n    private var lastAnnouncedWeatherId: String? = null\n''','toggle')
          r('    private fun formatSafetyWarningDistance(distanceBucketMeters: Int): String = when {\n','''    private fun refreshSafetyCamerasIfNeeded(location: UserLocationData, force: Boolean=false) {\n        if(!_uiState.value.isSafetyCamerasLayerVisible||_uiState.value.navigationState!=NavigationState.NAVIGATING)return\n        val now=System.currentTimeMillis(); val moved=lastSafetyCameraRefreshPoint?.distanceTo(location.point)?:Double.MAX_VALUE\n        if(!force&&now-lastSafetyCameraRefreshAt<45000L&&moved<750.0)return\n        lastSafetyCameraRefreshAt=now; lastSafetyCameraRefreshPoint=location.point; safetyCameraRefreshJob?.cancel()\n        safetyCameraRefreshJob=viewModelScope.launch {\n            val cams=safetyCameraRepository.getNearbyCameras(location.point)\n            if(_uiState.value.navigationState==NavigationState.NAVIGATING&&_uiState.value.isSafetyCamerasLayerVisible){_uiState.value=_uiState.value.copy(safetyCameras=cams);checkSafetyCameraProximity(cams)}\n        }\n    }\n\n    private fun formatSafetyWarningDistance(distanceBucketMeters: Int): String = when {\n''','helper')
          r('''    override fun onCleared() {\n        super.onCleared()\n        routeCalculationJob?.cancel()\n''','''    override fun onCleared() {\n        super.onCleared()\n        routeCalculationJob?.cancel()\n        safetyCameraRefreshJob?.cancel()\n''','cleared')
          f.write_text(s,encoding='utf-8')
          d=repo/'docs/PRODUCTION_READINESS.md'; t=d.read_text(encoding='utf-8'); t=t.replace('- Safety-camera warnings use real source data only, a 5 km warning envelope, 500 m TTS buckets and navigation-session reset behavior.\n','- Safety-camera warnings use real OpenStreetMap/Overpass source data, a verified in-memory stale-cache fallback, a 5 km warning envelope, 500 m TTS buckets and navigation-session reset behavior.\n'); d.write_text(t,encoding='utf-8')
          print('ok')
          PY
      - name: Validate
        run: |
          set -euo pipefail
          git diff --check
          ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/final-hardening-apply.yml .github/workflows/consolidate-final-hardening.yml
          git add app/src/main/java/com/example/haritalar/data/repository/SafetyCameraRepository.kt app/src/main/java/com/example/haritalar/ui/MainViewModel.kt docs/PRODUCTION_READINESS.md .github/workflows/final-hardening-apply.yml .github/workflows/consolidate-final-hardening.yml
          git commit -m 'fix: consolidate final safety camera runtime hardening'
          git push origin HEAD:feat/consolidated-final-product-hardening
